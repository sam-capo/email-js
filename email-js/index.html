<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Form</title>
    <link rel="stylesheet" href="css/styles.css" type="text/css">
    <script type="text/javascript"
        src="https://cdn.jsdelivr.net/npm/@emailjs/browser@5/dist/email.min.js">
    </script>
    <script type="text/javascript">
    (function(){
        emailjs.init({
        publicKey: "AUOTQYebwqQ5j7vrH",
        });
    })();
    </script>
</head>
<body>
    
    <h1>Contact Form</h1>

    <form id="contact">
        <input type="hidden" name="subject" id="subject" value="Contact Form Submission">

        Name:
        <input type="text" name="name" id="name">
        <br>

        Email:
        <input type="email" name="email" id="email">
        <br>

        Message:
        <textarea name="message" id="message"></textarea>
        <br>

        <button type="button" class="btn" onclick="sendEmail()">Send</button>
    </form>

    <script type="text/javascript" src="js/script.js"></script>
</body>
</html>
